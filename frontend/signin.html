<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Signin</h2>
        <form id="signin-form">
            <input type="email" id="signin-email" placeholder="Email" required>
            <input type="password" id="signin-password" placeholder="Password" required>
            <button type="submit">Signin</button>
        </form>
        <p id="signin-error" style="color: red; display: none;"></p>
        <p>Don't have an account? <a href="signup.html">Signup here</a></p>
    </div>

    <script>
        document.getElementById("signin-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("signin-email").value;
            const password = document.getElementById("signin-password").value;

            try {
                const response = await fetch("http://localhost:5000/signin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.status === 200) {
                    localStorage.setItem("user", JSON.stringify(result.user)); // Store user session
                    window.location.href = "home.html"; // Redirect to home page
                } else {
                    document.getElementById("signin-error").innerText = result.message;
                    document.getElementById("signin-error").style.display = "block";
                }
            } catch (error) {
                document.getElementById("signin-error").innerText = "Error: Unable to connect to the server.";
                document.getElementById("signin-error").style.display = "block";
            }
        });
    </script>
</body>
</html>
