<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Signup</h2>
        <form id="signup-form">
            <input type="text" id="signup-name" placeholder="Full Name" required>
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button type="submit">Signup</button>
        </form>
        <p id="signup-error" style="color: red; display: none;"></p>
        <p>Already have an account? <a href="signin.html">Signin here</a></p>
    </div>

    <script>
        document.getElementById("signup-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("signup-name").value; // Get name input
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;

            try {
                const response = await fetch("http://localhost:5000/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password }) // Send name too
                });

                const result = await response.json();

                if (response.status === 201) {
                    window.location.href = "signin.html"; // Redirect to signin page after successful signup
                } else {
                    document.getElementById("signup-error").innerText = result.message;
                    document.getElementById("signup-error").style.display = "block";
                }
            } catch (error) {
                document.getElementById("signup-error").innerText = "Error: Unable to connect to the server.";
                document.getElementById("signup-error").style.display = "block";
            }
        });
    </script>
</body>
</html>
