<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            localStorage.removeItem("user"); // Ensure no session is active
            window.location.href = "signup.html"; // Redirect to signup page first
        });
    </script>
</body>
</html>
